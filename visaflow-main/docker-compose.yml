services:
  dev:
    profiles: ["dev"]
    build: .
    volumes:
      - .:/workspace
      - /mnt/c/Users/rober/.claude:/home/dev/.claude    # WSL path to Windows
      - /mnt/c/Users/rober/.ssh:/home/dev/.ssh:ro       # WSL path to Windows
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      - GIT_USER_NAME=Rob
      - GIT_USER_EMAIL=hello@robertmarshall.dev

  redis:
    profiles: ["windows"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pdf-service:
    profiles: ["pdf", "windows"]
    build:
      context: ./services/pdf-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Development version without Docker build (uses local source)
  pdf-service-dev:
    profiles: ["dev-pdf"]
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./services/pdf-service:/app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    command: sh -c "apt-get update && apt-get install -y pdftk-java && npm install && npm run dev"

volumes:
  redis_data:
